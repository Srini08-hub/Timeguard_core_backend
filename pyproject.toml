[project]
name = "core-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "celery[redis]>=5.5.3",
    "google-api-python-client>=2.176.0",
    "google-auth>=2.40.3",
    "fastapi>=0.136.3",
    "pdfplumber>=0.11.7",
    "pymupdf>=1.26.4",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "alembic>=1.18.4",
    "langgraph>=1.2.5",
    "langchain-groq>=1.1.3",
    "langchain>=1.3.9",
    "rapidfuzz>=3.14.5",
    "openpyxl>=3.1.5",
    "langchain-google-genai>=4.2.5",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.16",
]
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
